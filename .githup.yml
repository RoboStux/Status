# RoboStux Status, powered by GitHup (https://github.com/StuxGroup/GitHup).
# Config reference: https://github.com/StuxGroup/GitHup#config-reference

site:
  name: RoboStux Status
  description: Keep track of RoboStux's services here.
  # Its own badge icon (the RoboStux mark with a heartbeat badge), built by scripts/badge-icons.py into icons/,
  # which GitHup publishes at the site root.
  logo: https://status.robo.st/icon-512.png
  favicon: https://status.robo.st/icon-512.png
  icons: icons
  cname: status.robo.st
  accent: "#a349a4"
  footer_links:
    - label: RoboStux
      url: https://robo.st
    - label: GitHub
      url: https://github.com/RoboStux/Status

legal:
  operator: RoboStux
  company: "RoboStux is an independent project built and maintained by Leo Ridgwell, operating under the name StuxieDev. It is not operated by any separate company or organization."
  contact: legal@stuxie.dev
  host: GitHub Pages
  effective: 1 October 2026

defaults:
  timeout: 15
  retries: 2
  max_response_time: 15000  # ms; GitHup's default. Slower (but otherwise good) answers show as degraded

incidents:
  enabled: true
  assignees: [StuxieDev]

# Shown as sections on the page, each with a combined status. Slugs are set
# explicitly, so moving a monitor between groups keeps its history.
groups:
  - name: Web
    description: The RoboStux website, its media, the archived earlier sites and the GitHub Pages redirect.
    monitors:
      - name: RoboStux Website
        slug: website
        url: https://robo.st
        description: The public website

      - name: RoboStux CDN
        slug: cdn
        url: https://global.media.robo.st/logo.png
        description: The media CDN

      - name: RoboStux Website v3
        slug: website-v3
        url: https://v3.robo.st
        description: The 2025-2026 website, archived at v3.robo.st

      - name: RoboStux Website v2
        slug: website-v2
        url: https://v2.robo.st
        description: The 2020-2025 website, archived at v2.robo.st

      - name: RoboStux Website v1
        slug: website-v1
        url: https://v1.robo.st
        description: The 2018-2020 holding page, archived at v1.robo.st

      # A meta-refresh page, so it answers 200 itself rather than redirecting.
      - name: RoboStux GitHub Pages
        slug: github-pages
        url: https://robostux.github.io
        description: The robostux.github.io redirect to the GitHub organisation

  - name: Bot
    description: RoboStux's shard 1 (shard1.robo.st) and the bot on each platform.
    monitors:
      # Every platform at once: 200 when every live platform is connected and ready (Discord and
      # Fluxer; Twitch is listed as coming soon and doesn't count until it's live). /health/all is the
      # same as /health. Slug kept from "RoboStux Node 1" (node1.robo.st, which now redirects here) so
      # its history carries on.
      - name: RoboStux Shard 1
        slug: node-1
        url: https://shard1.robo.st/health/all
        expected: [200]
        description: Shard 1's health for every platform (Discord and Fluxer; Twitch coming soon)

      # The Discord bot: 200 once it's connected and ready, 503 while it's starting or has
      # lost the gateway. Slug kept from "RoboStux Bot" so its history carries on.
      - name: RoboStux for Discord
        slug: bot
        url: https://shard1.robo.st/health/discord
        expected: [200]
        description: The Discord bot's health (connected and ready)

      # The Fluxer bot: 200 once it's connected and ready (ok, or degraded when Fluxer missed a
      # heartbeat), 503 while it's starting or has lost the gateway.
      - name: RoboStux for Fluxer
        slug: fluxer
        url: https://shard1.robo.st/health/fluxer
        expected: [200]
        description: The Fluxer bot's health (connected and ready)
