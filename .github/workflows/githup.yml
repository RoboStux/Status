# RoboStux Status: uptime checks and the status page at status.robo.st,
# powered by GitHup (https://github.com/StuxGroup/GitHup). The page is built
# into _site (legal pages, sitemap and 404 included), then
# deployed with actions/deploy-pages (Settings -> Pages -> Source: GitHub Actions).
name: GitHup

on:
  schedule:
    - cron: "*/5 * * * *"   # check every 5 minutes (GitHub may run it a little late)
    - cron: "7 * * * *"     # rebuild the status page every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .githup.yml
      - .github/workflows/githup.yml

permissions:
  contents: write   # commit data and the README table
  issues: write     # open and close incident issues
  pages: write      # deploy to GitHub Pages
  id-token: write

# One run at a time so data commits never race each other.
concurrency:
  group: githup
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.check.outputs.status-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - id: check
        uses: StuxGroup/GitHup@v1
        with:
          mode: check
          # Opt in: if GitHub runs the schedule late, catch up (up to 4 checks, 5 minutes apart).
          fill-gaps: "true"
          repeat: 4
          repeat-interval: 300

  site:
    needs: check
    # Rebuild when a status changed, on the hourly schedule, and on manual/config runs.
    if: >-
      always() && (
        needs.check.outputs.changed == 'true' ||
        github.event_name != 'schedule' ||
        github.event.schedule == '7 * * * *'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}  # includes the data just committed
      - uses: actions/configure-pages@v6
      - name: Update the status table in the README
        uses: StuxGroup/GitHup@v1
        with:
          mode: readme
      # GitHup empties site-dir before building, so the status page goes in first.
      - name: Build the status page
        uses: StuxGroup/GitHup@v1
        with:
          mode: site
          deploy: "false"
          site-dir: _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
