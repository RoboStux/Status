# RoboStux Status, powered by GitHup (https://github.com/StuxGroup/GitHup).
# Config reference: https://github.com/StuxGroup/GitHup#config-reference

site:
  name: RoboStux Status
  description: Keep track of RoboStux's services here.
  # Its own badge icon (the RoboStux mark with a heartbeat badge), built by scripts/badge-icons.py into icons/,
  # which GitHup publishes at the site root.
  logo: https://status.robo.st/icon-512.png
  favicon: https://status.robo.st/icon-512.png
  icons: icons
  cname: status.robo.st
  accent: "#a349a4"
  footer_links:
    - label: RoboStux
      url: https://robo.st
    - label: GitHub
      url: https://github.com/RoboStux/Status

legal:
  operator: RoboStux
  company: "RoboStux is an independent project built and maintained by Leo Ridgwell, operating under the name StuxieDev. It is not operated by any separate company or organization."
  contact: legal@stuxie.dev
  host: GitHub Pages
  effective: 1 October 2026

defaults:
  timeout: 15
  retries: 2
  max_response_time: 15000  # ms; GitHup's default. Slower (but otherwise good) answers show as degraded

incidents:
  enabled: true
  assignees: [StuxieDev]

# Shown as sections on the page, each with a combined status. Slugs are set
# explicitly, so moving a monitor between groups keeps its history.
groups:
  - name: Web
    description: The RoboStux website, its media, the preserved older sites and the GitHub Pages redirect.
    monitors:
      - name: RoboStux Website
        slug: website
        url: https://robo.st
        description: The public website

      - name: RoboStux CDN
        slug: cdn
        url: https://global.media.robo.st/logo.png
        description: The media CDN

      - name: RoboStux Old Website
        slug: old-website
        url: https://old.robo.st
        description: The 2022-2025 website design, preserved at old.robo.st

      - name: RoboStux Older Website
        slug: older-website
        url: https://older.robo.st
        description: The original holding page, preserved at older.robo.st

      # A meta-refresh page, so it answers 200 itself rather than redirecting.
      - name: RoboStux GitHub Pages
        slug: github-pages
        url: https://robostux.github.io
        description: The robostux.github.io redirect to the GitHub organisation

  - name: Bot
    description: The server RoboStux runs on, and the bot itself.
    monitors:
      # The server RoboStux runs on: nginx answers 200 at `/`.
      - name: RoboStux Node 1
        slug: node-1
        url: https://node1.robo.st/
        description: The server RoboStux runs on

      # RoboStux's own health endpoint (proxied by nginx): 200 once the bot is
      # connected and ready, 503 while it's starting or has lost the gateway.
      - name: RoboStux Bot
        slug: bot
        url: https://node1.robo.st/health
        expected: [200]
        description: The bot's health endpoint (connected and ready)
